<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>シマエナガ</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; left: 0; top: 0; display: block; pointer-events: none; }

</style>
</head>
<body>
<canvas id="world" width="1" height="1"></canvas>
<canvas id="bird" width="1" height="1"></canvas>
<script src="audio.js"></script>
<script src="bird.js"></script>
<script src="pet.js"></script>
</body>
</html>
